# Serves the built SPA and proxies API/auth calls to the BFF Service, so the browser
# sees a single origin and the session cookie works without CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BFF service (override via the BFF_UPSTREAM build/runtime if needed).
    location /api/ {
        proxy_pass http://device-mcp-ui-bff:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
        proxy_pass http://device-mcp-ui-bff:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # The provider plane (ADR-0013 §4/§8). Without this the SPA fallback below answers
    # `POST /provider/tenants/{t}/authorize` with index.html and a 200 — a grant that
    # appears to succeed and was never issued, which is the worst shape this could fail in.
    location /provider/ {
        proxy_pass http://device-mcp-ui-bff:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
