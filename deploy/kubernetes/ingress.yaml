apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: device-mcp-ui
  namespace: mcp-gateway-ui
  annotations:
    # Adjust to your ingress controller. Terminate TLS here in production.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: mcp-gateway-ui.example.com
      http:
        paths:
          # The web (nginx) container serves the SPA and proxies /api + /auth to the BFF,
          # so the Ingress only needs to route everything to the web Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: device-mcp-ui-web
                port:
                  number: 8080
  # tls:
  #   - hosts: [mcp-gateway-ui.example.com]
  #     secretName: device-mcp-ui-tls
