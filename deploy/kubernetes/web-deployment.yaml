apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-mcp-ui-web
  namespace: mcp-gateway-ui
  labels:
    app.kubernetes.io/name: device-mcp-ui-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: device-mcp-ui-web
  template:
    metadata:
      labels:
        app: device-mcp-ui-web
    spec:
      containers:
        - name: web
          image: device-mcp-ui-web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
