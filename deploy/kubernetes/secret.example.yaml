# Example only — DO NOT commit real secrets. Copy to secret.yaml, fill in, and apply
# separately (or source from a secret manager / sealed-secrets). secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: ui-bff-secrets
  namespace: mcp-gateway-ui
type: Opaque
stringData:
  # The BFF's own bearer token for the gateway API. Use a named `gateway.rbac` entry with
  # `role: console` — NOT the gateway's admin key (ADR-0023 slice 4). The same value goes
  # into the gateway's `gateway-credentials` Secret, projected to the path its `secret://`
  # reference names; see deploy/kubernetes/configmap.yaml in the gateway repo.
  GATEWAY_API_TOKEN: "replace-with-console-role-gateway-token"
  # UI login passwords → role. Empty disables that role's login.
  UI_ADMIN_PASSWORD: "replace-with-admin-password"
  UI_VIEWER_PASSWORD: "replace-with-viewer-password"
  # Signs the session-id cookie and the OIDC login transaction — use a long random
  # value (e.g. openssl rand -hex 32).
  SESSION_SECRET: "replace-with-random-32-byte-hex"
  # Shared server-side session store. REQUIRED whenever the BFF runs >1 replica
  # (this overlay does): sessions live server-side, and without a shared backend
  # each replica only sees its own. The URL may embed credentials, hence a secret.
  SESSION_REDIS_URL: "redis://:password@redis.mcp-gateway-ui.svc:6379/0"
  # OIDC confidential-client secret (ADR-0007). Leave empty for a public/PKCE-only client.
  # The other OIDC_* settings are non-secret and live in the ConfigMap.
  OIDC_CLIENT_SECRET: ""
  # ADR-0020: the catalog service's shared bearer token (device_mcp_catalog/app/auth.py
  # on the gateway repo side) — this BFF's only credential for it. The same value goes
  # into the catalog service's own CATALOG_API_TOKEN.
  CATALOG_API_TOKEN: "replace-with-catalog-service-token"
