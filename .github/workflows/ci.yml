name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger. Lets a run be started without pushing a commit — needed when
  # webhook delivery is degraded and pushes stop scheduling runs on their own.
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run gen:types        # generate src/gateway.d.ts from the committed snapshot
      # Contract drift guard. NOTE: this job has no gateway to compare against, so the
      # step reports "DID NOT RUN" and passes. It is real only in a job that sets
      # GATEWAY_OPENAPI_URL/FILE (add CHECK_SPEC_REQUIRED=1 there to make a missing
      # reference fail rather than shrug). Kept here so the script stays exercised.
      - run: npm run check:spec
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: black --check .
      - run: flake8 app tests --max-line-length=120
      - run: pytest -q
